# Porma Software secret guardrail — layer 3 (CI, the layer nobody can skip).
#
# Canonical copy: toolkit/secrets/secrets.yml. Installed as .github/workflows/secrets.yml
# by toolkit/secrets/install-repo.sh; never edit the copies, change it here and re-install.
#
# Two independent jobs:
#   detect-secrets   the working tree, against the committed .secrets.baseline (same engine
#                    as the local hooks, so CI and the developer agree)
#   gitleaks-history the FULL git history with the upstream rule set: catches what was
#                    committed before the guardrail existed or pushed with --no-verify
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-secrets:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Baseline present
        run: |
          set -euo pipefail
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Create it with toolkit/secrets/install-repo.sh"
            exit 1
          fi

      - name: detect-secrets over every tracked file
        # Exit 1 on any finding that is not already in the baseline. The baseline is the
        # audited list of accepted findings; adding to it is a reviewed commit, not a flag.
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 --no-run-if-empty \
            uvx --from 'detect-secrets==1.5.0' detect-secrets-hook --baseline .secrets.baseline

      - name: Baseline audit status
        # Informational: unaudited entries are accepted findings nobody has looked at yet.
        run: |
          set -euo pipefail
          uv run --no-project --quiet python - <<'PY'
          import json, pathlib
          baseline = json.loads(pathlib.Path(".secrets.baseline").read_text(encoding="utf-8"))
          results = baseline.get("results", {})
          total = sum(len(v) for v in results.values())
          unaudited = [
              f"{name}:{item['line_number']} {item['type']}"
              for name, items in sorted(results.items())
              for item in items
              if "is_secret" not in item
          ]
          print(f"baseline: {total} accepted finding(s), {len(unaudited)} not audited yet")
          for line in unaudited:
              print(f"::warning::unaudited baseline entry: {line}")
          PY

  gitleaks-history:
    runs-on: ${{ vars.CI_RUNNER_LIGHT || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # gitleaks scans commits, not the working tree

      - name: gitleaks over the full history
        run: |
          set -euo pipefail
          # Pinned by tag; digest at the time of pinning:
          # sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          image="zricethezav/gitleaks:v8.30.1"
          docker pull -q "$image"

          # NO bind mount on purpose. The self-hosted runners reach the daemon through a
          # docker socket proxy, so paths are resolved on the HOST: -v "$PWD:/repo" would
          # mount an empty directory and gitleaks would report "no leaks found" on nothing.
          # `docker cp` streams through the API and works on every runner.
          # GIT_CONFIG_*: the copied checkout keeps the runner's uid, git refuses to read a
          # repository owned by another user without it.
          cid="$(docker create \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$image" git /repo --no-banner --redact --verbose --exit-code 1)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true; rm -f gitleaks.log' EXIT
          docker cp . "$cid:/repo"

          rc=0
          docker start -a "$cid" >gitleaks.log 2>&1 || rc=$?
          cat gitleaks.log

          # gitleaks exits 0 on an empty directory ("0 commits scanned", no leaks found), so a
          # broken copy would look like a pass. Refuse that answer.
          commits="$(git rev-list --count HEAD)"
          if [ "$commits" -gt 0 ] && grep -Eq '(^|[^0-9])0 commits scanned' gitleaks.log; then
            echo "::error::gitleaks scanned 0 of the $commits commits: the checkout never reached the container"
            exit 1
          fi
          exit "$rc"
